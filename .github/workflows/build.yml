name: Build AutoHellevator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AutoHellevator.csproj

      - name: Build
        run: dotnet build AutoHellevator.csproj --configuration Release --no-restore

      - name: Find DLL
        run: find . -type f -name "AutoHellevator.dll" -print

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AutoHellevator
          path: "**/AutoHellevator.dll"
