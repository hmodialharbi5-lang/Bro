name: Build AutoHellevator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check dependencies
        run: |
          test -f TerrariaServer.dll
          test -f TShockAPI.dll

      - name: Build plugin
        run: dotnet build AutoHellevator.csproj --configuration Release

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AutoHellevator
          path: bin/Release/net10.0/AutoHellevator.dll
